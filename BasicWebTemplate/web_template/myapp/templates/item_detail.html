{% extends "base.html" %}

{% block title %}{{ object.name }}{% endblock %}

{% block content %}
    <h2>{{ object.name }}</h2>
    <p>{{ object.description }}</p>
    
    {% if user.is_authenticated %}
        <a href="{% url 'item_update' object.pk %}" class="btn btn-warning">Edit</a>
        <a href="{% url 'item_delete' object.pk %}" class="btn btn-danger">Delete</a>
    {% endif %}
    <a href="{% url 'item_list' %}" class="btn btn-secondary">Back</a>
{% endblock %}
