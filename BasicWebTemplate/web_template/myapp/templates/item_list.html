{% extends "base.html" %}

{% block title %}Item List{% endblock %}

{% block content %}
    <h2>Item List</h2>
    {% if user.is_authenticated %}
        <a href="{% url 'item_create' %}" class="btn btn-primary">Add New Item</a>
    {% endif %}
    <ul>
        {% for item in items %}
            <li>
                <a href="{% url 'item_detail' item.pk %}">{{ item.name }}</a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
